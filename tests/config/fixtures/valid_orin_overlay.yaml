# valid BUILD Orin overlay simulation: complete production config (passes production)
# Simulates configs/orin/rootfs/etc/tbox/conf.d/mqtt.yaml after BUILD overlay.
mqtt:
  broker_host: broker.orin.production.example
  broker_port: 8883
  identity:
    client_id_format: "{vin}-{sn}"
    prov_retry:
      initial_backoff_ms: 500
      max_backoff_ms: 30000
      multiplier: 2.0
  keepalive: 60
  clean_start: false
  session_expiry: 3600
  tls:
    credential_profile: mqtt
    min_version: "1.2"
    max_version: "1.3"
    handshake_timeout_ms: 10000
    credential_poll:
      initial_backoff_ms: 1000
      max_backoff_ms: 60000
  offline_queue:
    path: /var/tbox/mqtt/queue
    max_size: 1000
    drop_policy: drop_oldest
  ipc:
    socket_path: /run/tbox/mqtt.sock
    dispatch_queue_size: 1024
    subscriber_queue_size: 128
    slow_subscriber_policy: disconnect
  subscriptions:
    required_owners: ["tsp"]
    startup_wait_timeout_ms: 5000
    reconcile_timeout_ms: 10000
    suback_retry_max: 3
    owner_lease_ms: 0
