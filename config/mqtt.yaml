# TBOX MQTT Service Configuration (framework-config layer 1: conf.d/mqtt.yaml)
# This file contains MQTT-specific static configuration (read-only).
# Placed at: /etc/tbox/conf.d/mqtt.yaml
#
# Configuration is loaded via framework-config layered merge:
#   common.yaml -> conf.d/mqtt.yaml -> ./mqtt.yaml (deep merge, typed, fail-closed)
# All values are read-only at runtime. OTA-updatable params (broker_host, broker_port)
# are persisted via framework-store, not this file.
common:
  store:
    root: "./data"
  log:
    level: "info"                        # 日志级别（trace/debug/info/warn/error），覆盖 common.yaml
    file: "./log/mqtt.log"               # 日志文件路径（落盘目录由此推导）

mqtt:
  # --- Connection parameters (defaults; OTA-updatable via framework-store) ---
  broker_host: vagw.openiov.top
  broker_port: 8883

  # --- Static connection parameters (read-only) ---
  client_id: HWYZTEST900000001-00000001AA00000001          # VIN + SN combination
  keepalive: 60                    # seconds
  clean_start: false
  session_expiry: 3600             # seconds

  # --- TLS / mTLS (via SEC, CR-005) ---
  tls:
    credential_profile: mqtt          # fixed: mqtt (SEC TLS profile)
    min_version: "1.2"
    max_version: "1.3"
    handshake_timeout_ms: 10000
    credential_poll:
      initial_backoff_ms: 1000
      max_backoff_ms: 60000

  # --- MQTT username (optional, mTLS 默认认证) ---
  username: ""

  # --- Offline cache queue (MQTT self-developed persistence, Design §3) ---
  # Queue persistence is self-developed by MQTT (SQLite/file ring buffer),
  # NOT via framework-store. Only config params are specified here.
  offline_queue:
    path: /var/tbox/mqtt/queue
    max_size: 1000
    drop_policy: drop_oldest        # "drop_oldest" or "drop_lowest_priority"

  # --- Framework-IPC bus config (CR-004 §8) ---
  # MQTT daemon 使用 tbox::fw::ipc::Server 提供内部 publish/subscribe/route/state。
  ipc:
    socket_path: /tmp/tbox-mqtt.sock
    dispatch_queue_size: 1024        # 有界下行分发队列容量
    subscriber_queue_size: 128       # per-subscriber 有界队列容量
    slow_subscriber_policy: disconnect  # disconnect / drop / backpressure