# =============================================================================
# DEVELOPMENT-ONLY — 仅供本地调试/单元/集成测试显式引用
# =============================================================================
# TBOX-MQTT-DSN-CR-012 §3 / §17.1 / §17.5: config/dev/mqtt.yaml 不由
# mqtt-runtime 安装，不进入生产包。正式 /etc/tbox/conf.d/mqtt.yaml 由
# mqtt-runtime 安装 mqtt.default.yaml 生成，并由 BUILD Orin overlay 覆盖。
#
# 本文件用于本地调试/测试运行目录：可配置测试 Broker、mock endpoint、
# 临时 queue/store 目录或故障注入。使用方式：
#   - 显式以 config_root=config/dev/ 启动（framework 以 <root>/mqtt.yaml 加载）；
#   - 或复制为工作目录 ./mqtt.yaml（framework-config 第三层、最高优先级覆盖）。
#
# 允许清单（allowlist）约束（REQ-001/§17.5）：
#   - 不得包含真实生产 credential、设备身份或生产 Topic；
#   - production profile 拒绝本地 CA/cert/key 回退、测试 credential、
#     mock PROV/SEC、测试 fixture 和不受控路径；
#   - 不得改变 framework-store 允许运行时更新参数的事实来源；
#   - 不得改变 queue schema/format 或静默丢弃 accepted 消息。
# =============================================================================

# TBOX MQTT Service Configuration (development override)
# Configuration is loaded via framework-config layered merge:
#   common.yaml -> conf.d/mqtt.yaml -> ./mqtt.yaml (deep merge, typed, fail-closed)
# All values are read-only at runtime. OTA-updatable params (broker_host, broker_port)
# are persisted via framework-store, not this file.

# 开发环境 store 路径（避免污染系统目录）
common:
  store:
    root: "./data"
  # CR-008: log 配置由 common.yaml 统一提供（framework-log schema）。
  # 如需服务级日志覆盖，使用 framework schema：
  # log:
  #   file:
  #     enabled: true
  #     root: "./log"

mqtt:
  # --- Connection parameters (defaults; OTA-updatable via framework-store) ---
  # 测试 Broker 主机（非生产 credential；production profile 不得引用此值）
  broker_host: vagw.openiov.top
  broker_port: 8883

  # --- Static connection parameters (read-only) ---
  # CR-006 §9: client_id is no longer a static config value; it is derived
  # at runtime from PROV binding (VIN + SN). Only the format template is configured.
  identity:
    client_id_format: "{vin}-{sn}"    # cloud access contract; must reference vin and sn only
    prov_retry:
      initial_backoff_ms: 500
      max_backoff_ms: 30000
      multiplier: 2.0
  keepalive: 60                    # seconds
  clean_start: false
  session_expiry: 3600             # seconds

  # --- TLS / mTLS (via SEC, CR-005) ---
  tls:
    credential_profile: mqtt          # fixed: mqtt (SEC TLS profile)
    min_version: "1.2"
    max_version: "1.3"
    handshake_timeout_ms: 10000
    credential_poll:
      initial_backoff_ms: 1000
      max_backoff_ms: 60000

  # --- MQTT username (CR-006: runtime-derived from ecu_uid, not configured) ---

  # --- Offline cache queue (MQTT self-developed persistence, Design §3) ---
  # Queue persistence is self-developed by MQTT (SQLite/file ring buffer),
  # NOT via framework-store. Only config params are specified here.
  offline_queue:
    path: /var/tbox/mqtt/queue
    max_size: 1000
    drop_policy: drop_oldest        # "drop_oldest" or "drop_lowest_priority"

  # --- Framework-IPC bus config (CR-004 §8) ---
  # MQTT daemon 使用 tbox::fw::ipc::Server 提供内部 publish/subscribe/route/state。
  ipc:
    socket_path: /tmp/tbox-mqtt.sock
    dispatch_queue_size: 1024        # 有界下行分发队列容量
    subscriber_queue_size: 128       # per-subscriber 有界队列容量
    slow_subscriber_policy: disconnect  # disconnect / drop / backpressure

  # --- Subscription snapshot & Cloud Readiness (CR-007 §6) ---
  # required_owners 只配置 owner 身份，不配置其业务 Topic。
  subscriptions:
    required_owners: ["tsp"]
    startup_wait_timeout_ms: 5000    # 门闩等待超时（超时降级连接，不得 Cloud Ready）
    reconcile_timeout_ms: 10000      # SUBACK 收敛超时
    suback_retry_max: 3              # SUBACK 重试上限
    owner_lease_ms: 0                # 0=关闭自动过期，避免进程抖动误删订阅
